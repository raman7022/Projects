
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Runner</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="game">
        <header>
            <h1>🏃 TEMPLE RUNNER</h1>
            <div class="scoreboard">
                <span>Score: <b id="score">0</b></span>
                <span>Coins: <b id="coins">0</b></span>
                <span>Best: <b id="best">0</b></span>
            </div>
        </header>

        <section class="game-area">
            <canvas id="gameCanvas" width="900" height="600">
                Your browser does not support canvas.
            </canvas>

            <div class="overlay" id="overlay">
                <h2 id="overlayTitle">TEMPLE RUNNER</h2>
                <p id="overlayMessage">
                    Run through the jungle, collect coins
                    and escape the obstacles!
                </p>
                <button id="startBtn" type="button">
                    START GAME
                </button>
            </div>
        </section>

        <nav class="controls" aria-label="Game controls">
            <button id="leftBtn" type="button">⬅ LEFT</button>
            <button id="jumpBtn" type="button">⬆ JUMP</button>
            <button id="slideBtn" type="button">⬇ SLIDE</button>
            <button id="rightBtn" type="button">RIGHT ➡</button>
        </nav>

        <p class="help">
            Keyboard: ← → Move | ↑ / SPACE Jump | ↓ Slide
        </p>
    </main>

</body>
</html>
