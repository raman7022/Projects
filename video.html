
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #222;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        .video-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 15px;
        }

        video {
            width: 100%;
            border-radius: 12px;
            background: black;
        }
    </style>
</head>
<body>

    <h1>My Video Player</h1>

    <div class="video-container">
        <video controls>
            <source src="video.mp4" type="video/mp4">
            Your browser does not support video playback.
        </video>
    </div>

</body>
</html>
